name: Build and Push Docker Image to GHCR

on:
  push:
    branches:
      - main 
    # The image bakes in code/ and src/ (see the COPY lines in Dockerfile), so a
    # change to either must rebuild it. Without them, merging a code fix left
    # :latest stale and every tracking.py run silently pulled the old image --
    # the workaround was remembering to bump a comment in the Dockerfile.
    paths:
      - 'Dockerfile'
      - '.github/workflows/docker-publish.yml'
      - 'src/**'
      - 'code/**'

  workflow_dispatch:  

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get short Git SHA
        run: echo "GIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and tag Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/root-tracking-env:latest \
                       -t ghcr.io/${{ github.repository_owner }}/root-tracking-env:${{ env.GIT_SHA }} .

      - name: Push to GHCR
        run: docker push ghcr.io/${{ github.repository_owner }}/root-tracking-env:latest
